<script>
        function switchTab(tab) {
            const btnMasuk = document.getElementById('tab-masuk');
            const btnDaftar = document.getElementById('tab-daftar');
            const formMasuk = document.getElementById('form-masuk');
            const formDaftar = document.getElementById('form-daftar');

            const activeClass = ['text-primary', 'border-b-2', 'border-primary'];
            const inactiveClass = ['text-on-surface-variant', 'hover:text-on-surface', 'border-transparent'];

            if (tab === 'masuk') {
                btnMasuk.classList.add(...activeClass);
                btnMasuk.classList.remove(...inactiveClass);
                
                btnDaftar.classList.remove(...activeClass);
                btnDaftar.classList.add(...inactiveClass);
                
                formMasuk.classList.remove('hidden');
                formDaftar.classList.add('hidden');
            } else {
                btnDaftar.classList.add(...activeClass);
                btnDaftar.classList.remove(...inactiveClass);
                
                btnMasuk.classList.remove(...activeClass);
                btnMasuk.classList.add(...inactiveClass);
                
                formDaftar.classList.remove('hidden');
                formMasuk.classList.add('hidden');
            }
        }
    </script>
